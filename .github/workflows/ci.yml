name: CI

on:
  # Sui rami di lavoro basta l'evento della pull request: con `push:` senza
  # filtro ogni commit su un ramo con PR aperta faceva partire due volte la
  # stessa matrice, cioe' quattro job identici invece di due.
  push:
    branches: [main]
  pull_request:

# Un push che ne supera un altro sullo stesso ramo annulla la corsa precedente:
# aspettare l'esito di un commit gia' sostituito non serve a nessuno.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # La versione minima dichiarata in pyproject e una recente: se il codice
        # usa per sbaglio una novita' di Python, il primo lavoro fallisce.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Prepara Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installa FFmpeg
        # Non e' un pacchetto pip: e' un binario di sistema, e senza di lui
        # meta' dei test si salterebbe in silenzio.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Installa il progetto
        run: pip install -e ".[dev]"

      - name: Lint
        # `python -m` invece del comando nudo: garantisce lo stesso interprete
        # in cui abbiamo appena installato, qualunque cosa ci sia nel PATH.
        run: python -m ruff check .

      - name: Test
        run: python -m pytest -q

      - name: Il giro dei template, da capo a fondo
        # extract -> apply -> verifica che i tagli cadano dove dice il template.
        # Usa il comando `vedit` invece di `python -m vedit`: cosi' si verifica
        # anche che l'entry point dichiarato in pyproject funzioni davvero.
        # E' la promessa su cui si regge tutta la funzionalita': se salta, un
        # template non vale niente, perche' il suo unico valore e' la sincronia.
        run: |
          # Un riferimento con tagli a istanti noti (2.0, 3.5) e una cassa a 120 BPM
          ffmpeg -v error \
                 -f lavfi -i color=c=red:s=320x180:r=30:d=2 \
                 -f lavfi -i color=c=blue:s=320x180:r=30:d=1.5 \
                 -f lavfi -i color=c=yellow:s=320x180:r=30:d=2.5 \
                 -f lavfi -i "aevalsrc='sin(2*PI*60*t)*exp(-14*mod(t,0.5))':d=6:s=44100" \
                 -filter_complex "[0:v][1:v][2:v]concat=n=3:v=1:a=0[v]" \
                 -map "[v]" -map 3:a -c:a aac -pix_fmt yuv420p /tmp/riferimento.mp4

          vedit shots /tmp/riferimento.mp4
          vedit extract /tmp/riferimento.mp4 -o /tmp/tpl --force
          vedit templates /tmp | tail -2

          # Tre tinte diverse, una per slot: cosi' il taglio si vede nei pixel
          for c in green magenta cyan; do
            ffmpeg -v error -f lavfi -i color=c=$c:s=320x180:r=30:d=4 \
                   -pix_fmt yuv420p /tmp/media_$c.mp4
          done

          vedit apply /tmp/tpl /tmp/media_green.mp4 /tmp/media_magenta.mp4 \
                      /tmp/media_cyan.mp4 --check
          vedit apply /tmp/tpl /tmp/media_green.mp4 /tmp/media_magenta.mp4 \
                      /tmp/media_cyan.mp4 -o /tmp/montato.mp4

          python - <<'PY'
          import numpy as np, yaml
          from moviepy import VideoFileClip

          template = yaml.safe_load(open("/tmp/tpl/template.yaml"))
          istanti = [s["at"] for s in template["slots"]]
          clip = VideoFileClip("/tmp/montato.mp4")
          try:
              assert abs(clip.duration - template["duration"]) < 0.1, clip.duration
              for at in istanti[1:]:
                  prima = clip.get_frame(at - 0.05).mean(axis=(0, 1))
                  dopo = clip.get_frame(at + 0.05).mean(axis=(0, 1))
                  salto = np.abs(prima - dopo).max()
                  assert salto > 20, f"nessun taglio a {at}: {prima} -> {dopo}"
                  print(f"OK: taglio a {at}s  {prima.round(0)} -> {dopo.round(0)}")
          finally:
              clip.close()
          PY

      - name: Un edit con testi e una GIF, da capo a fondo
        # new -> edit.yaml con un testo -> --check -> render -> verifica che i
        # tagli cadano sugli istanti e che il testo si veda dove deve.
        run: |
          ffmpeg -v error -f lavfi -i "testsrc2=size=120x120:rate=10:duration=0.6" /tmp/media_onda.gif
          vedit new /tmp/edit --template /tmp/tpl /tmp/media_green.mp4 /tmp/media_onda.gif \
                    /tmp/media_cyan.mp4
          python - <<'PY'
          import yaml
          path = "/tmp/edit/edit.yaml"
          edit = yaml.safe_load(open(path))
          edit["texts"] = [{"text": "CIAO", "slot": 3, "position": "center",
                            "color": "white", "stroke_color": "black", "stroke_width": 2}]
          yaml.safe_dump(edit, open(path, "w"))
          PY
          vedit render /tmp/edit --check
          vedit render /tmp/edit -o /tmp/edit/output/edit.mp4

          python - <<'PY'
          import numpy as np, yaml
          from moviepy import VideoFileClip

          template = yaml.safe_load(open("/tmp/tpl/template.yaml"))
          istanti = [s["at"] for s in template["slots"]]
          clip = VideoFileClip("/tmp/edit/output/edit.mp4")
          try:
              for at in istanti[1:]:
                  prima = clip.get_frame(at - 0.05).mean(axis=(0, 1))
                  dopo = clip.get_frame(at + 0.05).mean(axis=(0, 1))
                  assert np.abs(prima - dopo).max() > 20, f"nessun taglio a {at}"
              # Il testo sta al centro del posto 3, che e' ciano: li' i pixel
              # bianchi possono venire solo dalle lettere.
              meta = (istanti[2] + template["duration"]) / 2
              centro = clip.get_frame(meta)[70:110, 120:200]
              assert (centro.min(axis=2) > 230).sum() > 30, "il testo non si vede"
              print("OK: tagli sugli istanti e testo visibile")
          finally:
              clip.close()
          PY
