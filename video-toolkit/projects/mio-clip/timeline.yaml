# ===========================================================================
# IL MIO CLIP — montaggio a istanti
#
# QUESTO E' L'UNICO NUMERO CHE CONTA: `at`.
# E' il momento, sul montaggio finale, in cui quella scena entra. Il segmento
# finisce quando comincia il successivo: le durate non si scrivono, si deducono.
#
# Sposti un taglio -> cambi UN numero, e si muove solo quel taglio.
# (Con le durate invece allungare uno spezzone spostava tutti quelli dopo.)
#
# Attenzione a non confonderli, sono due orologi diversi:
#     at     = quando entra in scena NEL MONTAGGIO
#     start  = da dove si prende NEL FILE SORGENTE
#
# La musica va a 118.4 BPM = un battito ogni 0.507s. Gli `at` qui sotto sono
# multipli di quel numero, ed e' per questo che i cambi cadono sulla cassa:
#     0.507  1.014  1.521  2.028  2.535  3.042  3.549  4.056  4.563  5.070
# Ma sono numeri come tutti gli altri: se un taglio ti piace mezzo battito piu'
# tardi, scrivi il numero che vuoi. Il montaggio lo decidi tu, non la griglia.
#
#   vedit render projects/mio-clip/timeline.yaml --check
#   vedit render projects/mio-clip/timeline.yaml --preview
# ===========================================================================

output:
  path: output/clip.mp4
  size: [1080, 1920]
  fps: 30
  preset: medium
  crf: 20

defaults:
  transition: 0
  transition_type: cut     # stacchi netti: con `at` le dissolvenze sposterebbero i clip
  fit: cover

timeline:

  # --- TENUTA: quattro battiti su un'immagine sola.
  - at: 0.00
    type: video
    src: assets/riferimento.mp4
    start: 1.20
    label: volto

  # --- RITMO: un battito a testa.
  - at: 2.028
    type: video
    src: assets/riferimento.mp4
    start: 6.36
    label: fuoco

  - at: 2.535
    type: video
    src: assets/riferimento.mp4
    start: 4.23
    label: scale

  - at: 3.042
    type: video
    src: assets/riferimento.mp4
    start: 5.24
    label: pianeti

  - at: 3.549
    type: video
    src: assets/riferimento.mp4
    start: 9.95
    label: bianconero

  # --- RAFFICA: mezzo battito a testa. Guarda che bella la colonna dei numeri:
  #     il passo si dimezza, e si vede a occhio prima ancora di renderizzare.
  - at: 4.056
    type: video
    src: assets/riferimento.mp4
    start: 8.26
    label: poster

  - at: 4.310
    type: video
    src: assets/riferimento.mp4
    start: 7.93
    label: labbra

  - at: 4.563
    type: video
    src: assets/riferimento.mp4
    start: 9.06
    label: cartone

  - at: 4.817
    type: video
    src: assets/riferimento.mp4
    start: 7.18
    label: volto-fuso

  - at: 5.070
    type: video
    src: assets/riferimento.mp4
    start: 9.53
    label: occhioni

  - at: 5.324
    type: video
    src: assets/riferimento.mp4
    start: 6.92
    label: verde

  # --- CHIUSURA: si torna larghi e si frena.
  - at: 5.577
    type: video
    src: assets/riferimento.mp4
    start: 10.80
    label: buio

  # L'ULTIMO segmento e' l'unico che deve dire dove finisce: non ha nessuno
  # dopo di se' che lo chiuda. Qui `end` e' nel tempo del sorgente.
  - at: 6.084
    type: video
    src: assets/riferimento.mp4
    start: 11.60
    end: 12.61             # 1.014s = due battiti
    label: occhi-chiusi

audio:
  src: assets/musica.m4a
  volume: 1.0
  fade_out: 0.4
  replace: true
