# ---------------------------------------------------------------------------
# TEMPLATE AUDIO: raffica
#
# Un montaggio riutilizzabile. La musica, gli istanti dei tagli e lo stile
# sono fissi; i media e i testi no: quelli li mette ogni edit.
#
#   vedit new edits/mio-video --template templates/raffica
#
# `at` e' l'istante in cui uno slot entra in scena, misurato sulla traccia
# audio qui sotto. Uno slot finisce quando comincia il successivo, e l'ultimo
# finisce con la traccia: le durate non si scrivono, si deducono.
# ---------------------------------------------------------------------------

name: raffica
duration: 18.1333         # quanto dura il montaggio completo

audio:
  src: audio.m4a          # la traccia, che vive dentro questa cartella
  bpm: 151.5              # un battito ogni 0.396s
  offset: 0.1             # dove cade il primo battito
  volume: 1               # 1 = com'e', 0.5 = a meta'
  fade_out: 0             # dissolvenza audio in chiusura

format:
  size: [720, 1280]       # si puo' cambiare quando lo applichi: --size 1080x1920
  fps: 30

# Come entrano i media: vale per tutti gli slot.
style:
  fit: contain            # contain = interi, con le bande; cover = a tutto schermo, tagliando i bordi
  background: [0, 0, 0]   # colore delle bande
  fade_in: 0              # secondi di dissolvenza dal nero all'inizio
  fade_out: 1.97          # secondi di dissolvenza al nero alla fine

# Lo stile dei testi che metterai negli edit. Ogni testo puo' cambiarlo.
text:
  font: DejaVu Sans Bold, Arial Bold, arialbd
  font_size: 54
  color: white
  stroke_color: black
  stroke_width: 4
  max_width: 0.84
  align: center

source:                 # da dove e' stato estratto: solo memoria
  file: edit.mp4
  duration: 18.13
  extracted: 2026-10-21
  note: un montaggio a tempo di musica su TikTok

# ---------------------------------------------------------------------------
# SLOT: 33 posti da riempire, in quest'ordine.
#
# hint dice cosa c'era in quel posto nel video di riferimento: un video
# (contenuto in movimento) o un'immagine ferma. E' un consiglio, non un
# obbligo. motion vale solo se in quello slot finisce una FOTO.
# ---------------------------------------------------------------------------
slots:
  - at: 0.0               #  1)  dura 3.86s, 9.75 battiti
    hint: video
    label: apertura
  - at: 3.862             #  2)  dura 0.20s, 0.50 battiti
